<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>EyeRest — 休息中</title>
    <link rel="stylesheet" href="./break.css" />
  </head>
  <body class="mode-fullscreen">
    <!-- Layered mountain silhouettes + lake gradient -->
    <div class="scene">
      <div class="sky"></div>
      <div class="mist mist-a"></div>
      <div class="mist mist-b"></div>
      <svg class="mountains" viewBox="0 0 1600 400" preserveAspectRatio="none" aria-hidden="true">
        <path class="ridge ridge-back"
              d="M0,280 L140,180 L260,240 L380,160 L520,230 L660,170 L820,240 L960,180 L1120,250 L1260,170 L1420,230 L1600,180 L1600,400 L0,400 Z" />
        <path class="ridge ridge-mid"
              d="M0,320 L100,260 L220,300 L340,240 L480,300 L620,250 L780,310 L900,260 L1060,310 L1200,260 L1340,300 L1500,260 L1600,290 L1600,400 L0,400 Z" />
        <path class="ridge ridge-front"
              d="M0,360 L180,320 L320,340 L500,310 L680,340 L860,320 L1020,350 L1200,320 L1380,350 L1600,330 L1600,400 L0,400 Z" />
      </svg>
      <div class="lake"></div>
    </div>

    <main class="content">
      <div class="label">20 / 20 / 20 護眼時刻</div>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="ring-track" cx="120" cy="120" r="108" />
          <circle class="ring-progress" cx="120" cy="120" r="108" />
        </svg>
        <div class="ring-center">
          <div class="count" id="count">20</div>
          <div class="count-unit">秒</div>
        </div>
      </div>
      <div class="guide" id="guide">看 6 公尺外的物體，讓眼睛休息</div>
      <div class="breath" id="breath">吸氣</div>

      <div class="actions" id="actions">
        <button class="btn btn-ghost" id="skip" hidden>跳過</button>
      </div>
    </main>

    <audio id="chime" preload="auto">
      <source src="../../../assets/sounds/chime.mp3" type="audio/mpeg" />
    </audio>
    <script src="./break.js"></script>
  </body>
</html>
