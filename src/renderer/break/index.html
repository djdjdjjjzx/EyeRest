<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EyeRest — 休息中</title>
  <link rel="stylesheet" href="./break.css" />
</head>
<body class="mode-fullscreen">
  <div class="scene" aria-hidden="true"><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="horizon"></div></div>
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><span>EyeRest</span></div>
    <span class="session"><span class="status-dot"></span><span class="label">眼睛休息時間</span></span>
  </header>
  <main class="content">
    <div class="rest-symbol" aria-hidden="true"><div class="orbit orbit-outer"></div><div class="orbit orbit-inner"></div><svg viewBox="0 0 80 80" fill="none"><path d="M40 60V37M40 47C22 48 17 35 19 23c14-1 24 9 21 24ZM40 39C39 24 49 17 62 18c1 13-7 23-22 21Z"/></svg></div>
    <div class="intro"><p class="eyebrow" id="eyebrow">A MOMENT FOR YOUR EYES</p><h1 id="heading">把目光，留給遠方。</h1><p class="guide" id="guide">望向 6 公尺外，讓眼睛慢慢放鬆。</p></div>
    <div class="timer" role="timer" aria-label="休息剩餘時間"><span class="count" id="count">20</span><span class="count-unit" id="count-unit">秒後，繼續剛剛的美好</span></div>
    <div class="progress-track" aria-hidden="true"><div class="progress" id="progress"></div></div>
    <div class="breathing"><span class="breath-dot" aria-hidden="true"></span><span id="breath">吸氣</span><span class="breath-note">讓節奏慢下來</span></div>
    <div class="actions" id="actions"><button class="btn" id="skip" hidden>跳過這次休息 <span class="key-hint">Esc</span></button></div>
  </main>
  <footer class="footer"><span class="footer-line"></span><span>短暫留白，是為了看見更多。</span><span class="footer-line"></span></footer>
  <script src="./break.js"></script>
</body>
</html>
