<\!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>EyeRest — 設定</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-title">EyeRest</div>
      <div class="hero-sub">20-20-20 護眼法則 · 智慧閒置偵測</div>
      <div class="status" id="status">狀態載入中…</div>
    </header>

    <section class="card">
      <h3>時間設定</h3>

      <label class="row">
        <div class="row-head">
          <span>工作時間</span>
          <span class="value" id="workOut">20 分</span>
        </div>
        <input type="range" id="workMin" min="1" max="60" step="1" value="20" />
        <div class="hint">每隔多久提醒你休息眼睛</div>
      </label>

      <label class="row">
        <div class="row-head">
          <span>休息時間</span>
          <span class="value" id="breakOut">20 秒</span>
        </div>
        <input type="range" id="breakSec" min="10" max="300" step="5" value="20" />
        <div class="hint">看 6 公尺外物體的時間長度</div>
      </label>

      <label class="row">
        <div class="row-head">
          <span>離開座位時間歸零</span>
          <span class="value" id="idleOut">2 分</span>
        </div>
        <input type="range" id="idleMin" min="1" max="30" step="1" value="2" />
        <div class="hint">
          超過這段時間沒動滑鼠/鍵盤 → 視為你已經在休息、計時器歸零重算
        </div>
      </label>
    </section>

    <section class="card">
      <h3>預先警告</h3>
      <label class="toggle">
        <input type="checkbox" id="preWarningEnabled" />
        <span>休息前跳出小視窗提醒（立刻休息 / 再 3 分 / Skip）</span>
      </label>
      <label class="row">
        <div class="row-head">
          <span>提前多久警告</span>
          <span class="value" id="preWarnOut">1 分</span>
        </div>
        <input type="range" id="preWarnSec" min="10" max="300" step="10" value="60" />
        <div class="hint">適合打遊戲、開會時先有心理準備</div>
      </label>
    </section>

    <section class="card">
      <h3>提醒方式</h3>
      <div class="seg" role="radiogroup" id="mode">
        <button role="radio" data-value="fullscreen">全螢幕</button>
        <button role="radio" data-value="overlay">半透明覆蓋</button>
        <button role="radio" data-value="notification">角落通知</button>
      </div>

      <label class="toggle">
        <input type="checkbox" id="soundEnabled" />
        <span>播放提醒音效</span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="allowSkip" />
        <span>允許「跳過」按鈕</span>
      </label>
    </section>

    <section class="card">
      <h3>長休息（深度休息）</h3>
      <label class="toggle">
        <input type="checkbox" id="longBreakEnabled" />
        <span>每隔幾次休息，改成更長的「深度休息」</span>
      </label>

      <label class="row">
        <div class="row-head">
          <span>每幾次休息一次長休息</span>
          <span class="value" id="longEveryOut">3 次</span>
        </div>
        <input type="range" id="longEvery" min="2" max="10" step="1" value="3" />
        <div class="hint">例如設為 3 → 第 3、6、9 次休息變成長休息</div>
      </label>

      <label class="row">
        <div class="row-head">
          <span>長休息時間</span>
          <span class="value" id="longDurOut">3 分</span>
        </div>
        <input type="range" id="longDur" min="60" max="900" step="30" value="180" />
        <div class="hint">建議站起來、走走、看遠方</div>
      </label>

      <label class="toggle">
        <input type="checkbox" id="forceLongAfterSkip" />
        <span>使用 Skip 跳過後，下一次強制改成長休息</span>
      </label>
    </section>

    <section class="card">
      <h3>遊戲期間暫停</h3>
      <label class="toggle">
        <input type="checkbox" id="gamePauseEnabled" />
        <span>遊戲期間自動暫停倒數（Windows）</span>
      </label>
      <div class="hint">清單內的遊戲在前景時暫停，切走後接續剩餘時間。請選遊戲本體 .exe，勿選 Steam 等啟動器；已開始的休息仍會繼續。</div>
      <ul id="gameList" class="game-list"></ul>
      <button class="btn" id="addGame">加入遊戲執行檔…</button>
      <div class="hint" id="gameError" role="status"></div>
    </section>

    <section class="card">
      <h3>系統</h3>
      <label class="toggle">
        <input type="checkbox" id="autoLaunch" />
        <span>開機時自動啟動 EyeRest</span>
      </label>
      <div class="actions-row">
        <button class="btn btn-primary" id="breakNow">立刻休息一次</button>
        <button class="btn" id="pauseToggle">暫停</button>
      </div>
    </section>

    <footer class="footer">EyeRest v0.1.0</footer>

    <script src="./settings.js"></script>
  </body>
</html>
